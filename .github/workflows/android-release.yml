name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - kilo/shiny-lake-rlu

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The checked-in Android folder was created with an unsupported
      # Gradle layout. Generate a fresh platform scaffold while preserving
      # the actual Flutter app source and dependencies.
      - name: Regenerate Android platform
        shell: bash
        run: |
          flutter create --platforms=android --project-name pa_helper --org com.example /tmp/pa_helper_scaffold
          rm -rf android
          cp -R /tmp/pa_helper_scaffold/android ./android
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          content = content.replace(
              '>',
              '>' + chr(10) + '    <uses-permission android:name="android.permission.CAMERA" />' + chr(10) + '    <uses-feature android:name="android.hardware.camera.flash" android:required="false" />',
              1,
          )
          manifest.write_text(content)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pa-helper-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
